name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Package ARM64 C++ runtime
        run: |
          set -eux
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          RUNTIME="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$RUNTIME"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNTIME" app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: halo2-android-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
